name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: pytest -q
      - name: Smoke evidence
        run: python -m dq_rescue.cli smoke
      - name: Generate rescue evidence
        run: |
          python -m dq_rescue.cli report
          test -s output/data_quality_rescue.html
          test -s output/dq_evidence.sqlite
      - name: Reverse-test evidence
        run: python -m dq_rescue.cli reverse-test
